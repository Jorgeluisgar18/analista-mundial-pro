name: PostgreSQL rate limit

on:
  pull_request:
    paths:
      - src/lib/http/persistentRateLimit.ts
      - tests/integration/persistent-rate-limit-postgres.test.ts
      - .github/workflows/rate-limit-postgres.yml
      - prisma/schema.prisma
      - package*.json
  push:
    branches: [master]
    paths:
      - src/lib/http/persistentRateLimit.ts
      - tests/integration/persistent-rate-limit-postgres.test.ts
      - .github/workflows/rate-limit-postgres.yml
      - prisma/schema.prisma
      - package*.json

permissions:
  contents: read

jobs:
  postgres-rate-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rate_limit_ci
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports: ["5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check real PostgreSQL concurrency
        run: node node_modules/vitest/vitest.mjs run tests/integration/persistent-rate-limit-postgres.test.ts --environment node --maxWorkers=1
        env:
          RATE_LIMIT_TEST_POSTGRES: "1"
          RATE_LIMIT_TEST_PASSWORD: ${{ github.run_id }}
          PGPORT: ${{ job.services.postgres.ports[5432] }}
